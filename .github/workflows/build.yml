name: Build and upload jar

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
      - name: Prepare downloadable jar
        run: |
          shopt -s nullglob
          jars=(build/libs/PistonMOTD-*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No PistonMOTD-*.jar found under build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          cp -f "${jars[0]}" build/libs/PistonMOTD.jar
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: true
          files: build/libs/PistonMOTD.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Download **PistonMOTD.jar** (a jar, not a zip) and put it in your server `plugins` folder.

            Built from ${{ github.sha }}
